import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"easy-trade" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu is only needed at compile time; the integration is optional at runtime.
	compileOnly "com.terraformersmc:modmenu:21.0.0"
}

repositories {
	maven {
		url = "https://maven.terraformersmc.com/releases"
	}
}

def easyTradeLanguageBundle = layout.projectDirectory.file("src/localization/easy-trade-languages.json")
def generatedEasyTradeLanguages = layout.buildDirectory.dir("generated/easy-trade-languages")
sourceSets.client.resources.srcDir(generatedEasyTradeLanguages)

tasks.register("generateEasyTradeLanguages") {
	inputs.file(easyTradeLanguageBundle)
	outputs.dir(generatedEasyTradeLanguages)

	doLast {
		def bundle = new JsonSlurper().parse(easyTradeLanguageBundle.asFile)
		if (!bundle.keys || !bundle.locales || !bundle.translations.en) {
			throw new GradleException("The Easy Trade language bundle must define keys, locales, and English translations")
		}
		if (bundle.locales.toSet().size() != bundle.locales.size()) {
			throw new GradleException("The Easy Trade language bundle contains duplicate locales")
		}
		bundle.translations.each { language, translations ->
			if (translations.size() != bundle.keys.size()) {
				throw new GradleException("Translation '$language' does not provide a string for every key")
			}
		}

		def outputRoot = generatedEasyTradeLanguages.get().asFile
		if (outputRoot.exists() && !outputRoot.deleteDir()) {
			throw new GradleException("Could not clean generated Easy Trade language resources")
		}

		bundle.locales.each { locale ->
			if (locale != "en_us" && locale != "es_es") {
				def language = locale.split("_")[0]
				def translations = bundle.translations[language] ?: bundle.translations["en"]
				def messages = ["key.category.easy-trade.controls": "Easy Trade"]
				bundle.keys.eachWithIndex { key, index -> messages[key] = translations[index] }
				messages.putAll(language == "es" ? [
					"easy-trade.config.title": "Configuración de Easy Trade",
					"easy-trade.config.labels": "Etiquetas de libros encantados",
					"easy-trade.config.previews": "Vista previa de intercambios bloqueados",
					"easy-trade.config.cycling": "Ciclado de intercambios",
					"easy-trade.config.enabled": "Activado",
					"easy-trade.config.disabled": "Desactivado",
					"easy-trade.config.done": "Listo",
					"easy-trade.config.cancel": "Cancelar",
					"easy-trade.config.save": "Guardar y salir"
				] : [
					"easy-trade.config.title": "Easy Trade Settings",
					"easy-trade.config.labels": "Enchanted-book labels",
					"easy-trade.config.previews": "Locked-trade previews",
					"easy-trade.config.cycling": "Trade cycling",
					"easy-trade.config.enabled": "Enabled",
					"easy-trade.config.disabled": "Disabled",
					"easy-trade.config.done": "Done",
					"easy-trade.config.cancel": "Cancel",
					"easy-trade.config.save": "Save & Exit"
				])
				def languageFile = new File(outputRoot, "assets/easy-trade/lang/${locale}.json")
				languageFile.parentFile.mkdirs()
				languageFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(messages)) + System.lineSeparator(), "UTF-8")
			}
		}
	}
}

tasks.named("processClientResources") {
	dependsOn(tasks.named("generateEasyTradeLanguages"))
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
	dependsOn(tasks.named("generateEasyTradeLanguages"))
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "easy-trade-test"
		enableClientGameTests = false
		eula = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
